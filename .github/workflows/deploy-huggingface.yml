name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hugging-face-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate app files
        run: |
          test -f app.py
          test -f requirements.txt
          test -d src/vehicle_id
          grep -q '^sdk: gradio$' README.md

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: lonewolfpradeep/vehicle-recognition-system
        run: |
          python -m pip install --upgrade huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          space_id = os.environ.get("HF_SPACE_ID")
          if not token:
              raise SystemExit("Missing repository secret HF_TOKEN.")
          api = HfApi(token=token)
          api.create_repo(repo_id=space_id, repo_type="space", space_sdk="gradio", exist_ok=True)
          api.upload_folder(
              repo_id=space_id,
              repo_type="space",
              folder_path=".",
              ignore_patterns=[
                  ".git/**", ".github/**", ".gitignore", ".dockerignore",
                  "notebooks/**", "scripts/**", "tests/**", "docs/**",
                  "deploy/**", "checkpoints/**", "data/**", "*.ipynb",
              ],
              commit_message="Deploy from GitHub Actions",
          )
          print(f"Deployed source to https://huggingface.co/spaces/{space_id}")
          PY
